[project]
name = "hello-world"
version = "0.1.0"
description = "hello world"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-quark>=0.1.1",
    "nonebot-plugin-wiki>=0.1.0",
    "nonebot-plugin-apscheduler>=0.5.0",
]

[tool.nonebot]
plugin_dirs = ["src/plugins"]
builtin_plugins = []
# plugins = ["nonebot_plugin_quark"]

[tool.nonebot.adapters]
onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-quark = ["nonebot_plugin_quark"]
# nonebot-plugin-wiki = ["nonebot_plugin_wiki"]
